[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "secureclaw"
version = "1.2.0"
description = "Cross-platform prompt injection scanner for AI tool users"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [
    { name = "Sparkry AI", email = "hello@sparkry.ai" },
]
keywords = ["security", "prompt-injection", "ai", "scanner", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
# Runtime dependencies. Per v1.3-plan-v10 §B.8 + §G.0: stdlib-only EXCEPT
# these explicitly approved permissive deps:
#   regex      — Unicode property classes (\p{Lu}|\p{Lo}) for sentence
#                segmentation across CJK/Arabic/Latin; per-match `timeout=`
#                parameter for ReDoS protection. Apache-2.0.
#   send2trash — cross-platform recoverable delete (XDG trash on Linux,
#                Finder Trash on macOS, Recycle Bin on Windows). BSD-3.
# regex pinned exactly; send2trash range-pinned. Dependabot config
# (PR-J2) auto-merges patch/minor updates after CI green.
dependencies = [
    "regex==2024.11.6",
    "send2trash>=1.8,<2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "PyYAML>=6.0", "packaging>=23.0"]

[project.scripts]
secureclaw = "secureclaw.cli:main"

[project.urls]
Homepage = "https://secureclaw.sparkry.ai"
Repository = "https://github.com/sparkst/secureclaw"
Issues = "https://github.com/sparkst/secureclaw/issues"

[tool.hatch.build.targets.wheel]
packages = ["secureclaw"]

[tool.hatch.build.targets.wheel.force-include]
"secureclaw/rules/default_rules.json" = "secureclaw/rules/default_rules.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "PTH"]

[tool.ruff.lint.per-file-ignores]
"secureclaw/reporters/html_report.py" = ["E501"]

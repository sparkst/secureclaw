# Cross-platform validation across self-hosted Tailscale runners + GH-hosted Linux.
#
# Quorum rule (REQ-7.1): >=3 of 4 self-hosted runners GREEN, AND
# [mac-arm64-jarvis OR mac-arm64-macbook] AND linux-ubuntu MUST be GREEN.
# macair runs informationally (continue-on-error: true); macair offline does
# NOT block merge.
#
# This workflow is gated by the RUNNERS_REGISTERED repo variable. While that
# variable is unset/false, only the GH-hosted Linux job runs. After all 4
# self-hosted runners are registered, set RUNNERS_REGISTERED=true to enable
# the matrix.

name: Cross-Platform CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: read

jobs:
  github-hosted-linux:
    name: gh-hosted ubuntu-24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check secureclaw/ tests/
      - name: Format check
        run: ruff format --check secureclaw/ tests/
      - name: Test
        run: python -m pytest tests/ -v --tb=short

  self-hosted-jarvis:
    name: self-hosted mac-arm64-jarvis
    runs-on: [self-hosted, mac-arm64-jarvis]
    if: ${{ vars.RUNNERS_REGISTERED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest tests/ -v --tb=short

  self-hosted-macbook:
    name: self-hosted mac-arm64-macbook
    runs-on: [self-hosted, mac-arm64-macbook]
    if: ${{ vars.RUNNERS_REGISTERED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest tests/ -v --tb=short

  self-hosted-ubuntu:
    name: self-hosted linux-ubuntu
    runs-on: [self-hosted, linux-ubuntu]
    if: ${{ vars.RUNNERS_REGISTERED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest tests/ -v --tb=short

  self-hosted-macair:
    name: self-hosted mac-sequoia-air
    runs-on: [self-hosted, mac-sequoia-air]
    continue-on-error: true
    if: ${{ vars.RUNNERS_REGISTERED == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - name: Test
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/python -m pytest tests/ -v --tb=short

  quorum-gate:
    name: cross-platform quorum
    needs: [self-hosted-jarvis, self-hosted-macbook, self-hosted-ubuntu, self-hosted-macair]
    if: ${{ always() && vars.RUNNERS_REGISTERED == 'true' }}
    runs-on: ubuntu-24.04
    env:
      JARVIS: ${{ needs.self-hosted-jarvis.result }}
      MACBOOK: ${{ needs.self-hosted-macbook.result }}
      UBUNTU: ${{ needs.self-hosted-ubuntu.result }}
      MACAIR: ${{ needs.self-hosted-macair.result }}
    steps:
      - name: Evaluate quorum
        run: |
          set -e
          GREEN_COUNT=0
          for r in "$JARVIS" "$MACBOOK" "$UBUNTU" "$MACAIR"; do
            if [ "$r" = "success" ]; then GREEN_COUNT=$((GREEN_COUNT + 1)); fi
          done
          if [ "$JARVIS" != "success" ] && [ "$MACBOOK" != "success" ]; then
            echo "::error::Neither jarvis nor macbook is GREEN. Quorum failed."
            exit 1
          fi
          if [ "$UBUNTU" != "success" ]; then
            echo "::error::ubuntu runner is not GREEN. Quorum failed."
            exit 1
          fi
          if [ "$GREEN_COUNT" -lt 3 ]; then
            echo "::error::Only $GREEN_COUNT of 4 self-hosted runners GREEN; need at least 3."
            exit 1
          fi
          echo "Quorum OK: $GREEN_COUNT of 4 runners GREEN."
